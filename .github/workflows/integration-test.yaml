name: "Integration Test"

on:
  push:
    # Dependabot has no access to the secrets that this workflow requires. So we
    # skip running the workflow in branches that dependabot presumably created.
    branches-ignore:
      - "dependabot/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Setup Git Project"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7

      - name: "Setup Go Env"
        uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" # v7
        with:
          cache: true
          go-version: "1.25.1"

      - name: "Check Go Tests"
        env:
          ROGHFS_GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          go test -tags=integration -v -race
